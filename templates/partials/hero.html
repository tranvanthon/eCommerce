{% load static %}

<div class="hero-wrapper py-4">
  <div class="container">
    <div class="row g-3">
      <div class="col-lg-9">
        <div id="mainCarousel" class="carousel slide h-100 shadow-sm" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=1200" class="d-block w-100" alt="Slider 1" />
              <div class="carousel-caption d-none d-md-block text-start pb-5">
                <h2 class="display-5 fw-bold text-white">Laptop Gaming Thế Hệ Mới</h2>
                <p>Giảm ngay 2.000.000đ khi đặt trước hôm nay.</p>
                <a href="#" class="btn btn-primary px-4">Mua ngay</a>
              </div>
            </div>
            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=1200" class="d-block w-100" alt="Slider 2" />
              <div class="carousel-caption d-none d-md-block text-start pb-5">
                <h2 class="display-5 fw-bold text-white">Làm Việc Cực Đỉnh</h2>
                <p>Ưu đãi trả góp 0% cho tất cả dòng Macbook.</p>
                <a href="#" class="btn btn-primary px-4">Khám phá</a>
              </div>
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
      </div>
      <div class="col-lg-3 d-none d-lg-block">
        <div class="promo-banner" style="background-image: url('https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400');">
          <div>
            <h6>Galaxy S24</h6><span class="badge bg-warning text-dark">Giá sốc</span>
          </div>
        </div>
        <div class="promo-banner" style="background-image: url('https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=400');">
          <div>
            <h6>iPad Air M2</h6><span class="text-white">Xem ngay</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
